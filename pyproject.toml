[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "semantic-grasp-planner"
version = "3.0.2.post1"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24","scipy>=1.11","Pillow>=10","PyYAML>=6","trimesh>=4.5","rtree>=1.3","python-fcl>=0.7","matplotlib>=3.8","plotly>=5.24","pydantic>=2.9","psutil>=6","fast-simplification>=0.1.9","scikit-learn>=1.5","embreex>=2.17","networkx>=3","shapely>=2","coacd>=1.0","manifold3d>=3.0"]
[project.optional-dependencies]
api = ["fastapi>=0.115","uvicorn>=0.30"]
test = ["pytest>=8","httpx>=0.27"]
[project.scripts]
grasp-v3 = "grasp_planner.cli:main"
[tool.setuptools.packages.find]
include = ["grasp_planner*"]
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
grasp_planner = ["assets/**/*", "assets/*"]
